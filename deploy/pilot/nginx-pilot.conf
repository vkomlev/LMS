# Экземпляр «pilot» — копия платформы для школы коллег (tsk-764).
# Установить в /etc/nginx/sites-available/pilot.conf, включить симлинком
# в sites-enabled. Порядок правки: менять здесь → копировать на сервер →
# `nginx -t` → `systemctl reload nginx`. Не наоборот (урок tsk-614: файл в
# репозитории разошёлся с боем на 280 строк и правки перестали доезжать).
#
# ВНИМАНИЕ: после первого `certbot --nginx` этот файл на сервере будет
# отредактирован certbot'ом (пути к сертификату, 80-й блок). Снять снимок
# обратно в репозиторий сразу после выпуска сертификата.
#
# Один домен на весь экземпляр, в отличие от боевого (learn.* + api.learn.*):
# ученику и преподавателю нужен один адрес, а разделять API на свой домен
# нечему — сторонних потребителей (боты, встройка в сайт) у пилота нет.

server {
    listen 80;
    listen [::]:80;
    server_name pilot.victor-komlev.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pilot.victor-komlev.ru;

    ssl_certificate     /etc/letsencrypt/live/pilot.victor-komlev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilot.victor-komlev.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    client_max_body_size 10M;

    # ГЛАВНЫЙ БЛОК ИЗОЛЯЦИИ (урок tsk-614). Без него `/api/v1/*` попадает в
    # переадресацию из `next.config.ts`, а она замирает на этапе `pnpm build`
    # и по умолчанию ведёт в http://localhost:8000 — то есть в БОЕВУЮ LMS.
    # Полигон так и уводил учеников на прод, пока это не нашли. Здесь тот же
    # приём, что на проде: маршрут держит nginx, а не сборка.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /embed-api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }
}
