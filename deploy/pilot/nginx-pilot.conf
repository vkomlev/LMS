# Экземпляр «pilot» — копия платформы для школы коллег (tsk-764).
#
# ЭТО СНИМОК ЖИВОГО ФАЙЛА с сервера lms-spw-vds
# (/etc/nginx/sites-enabled/pilot.conf), снятый после `certbot --nginx`.
# Снимок, а не черновик — намеренно: в tsk-614 черновик полигона разошёлся
# с боем на 280 строк, и правки перестали доезжать в обе стороны.
# Порядок правки: менять здесь → копировать на сервер → `nginx -t` →
# `systemctl reload nginx`. `nginx -t` обязателен: тот же процесс обслуживает бой.
#
# Один домен на весь экземпляр, в отличие от боевого (learn.* + api.learn.*):
# ученику и преподавателю нужен один адрес, сторонних потребителей API у пилота нет.
#
# Блок `location /api/v1/` — ГЛАВНЫЙ для изоляции. Без него запрос попадает в
# переадресацию из next.config.ts, а она замирает на сборке; у полигона она вела
# в БОЕВУЮ LMS 127.0.0.1:8000, и ученики уходили в настоящую систему (tsk-614).
# Маршрут держит nginx, а не сборка.

server {
    server_name pilot.victor-komlev.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 10M;
    # tsk-764: тот же набор, что у боевого (deploy/vps/nginx-spw.conf, tsk-159).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;


    # Маршрут API держит nginx, а не переадресация Next: она замирает на сборке
    # и у полигона вела в БОЕВУЮ LMS (tsk-614).
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /embed-api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pilot.victor-komlev.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pilot.victor-komlev.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pilot.victor-komlev.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pilot.victor-komlev.ru;
    return 404; # managed by Certbot


}