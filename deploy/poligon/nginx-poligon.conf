# Учебный полигон QA (tsk-182) — финальный конфиг, все 6 доменов с реальными
# сертификатами Let's Encrypt (dev: cert dev-poligon.*, test: cert
# test-poligon.*, stage: cert stage-poligon.*, выпущены отдельными
# certbot-запусками).
#
# tsk-614 (14.08.2026): этот файл — СНИМОК живого /etc/nginx/sites-enabled/
# poligon.conf с сервера lms-spw-vds. Прежняя версия в репозитории была
# черновиком «до certbot» и разошлась с боем на ~280 строк (certbot переписал
# server-блоки и пути к сертификатам), поэтому правка в репозитории не доезжала
# до сервера, а правка на сервере не возвращалась в репозиторий. Теперь здесь
# лежит то, что реально обслуживает полигон.
#
# Что при этом потерял черновик и стоит вернуть отдельной задачей (на сервере
# этого нет и не было): заголовок `Referrer-Policy strict-origin-when-cross-origin`
# и `http2` в listen-директивах.
#
# Порядок правки: менять здесь → копировать на сервер → `nginx -t` →
# `systemctl reload nginx`. Не наоборот.

# ═══════════════════════ dev ═══════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name api-dev-poligon.victor-komlev.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-dev-poligon.victor-komlev.ru;
    ssl_certificate /etc/letsencrypt/live/dev-poligon.victor-komlev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-poligon.victor-komlev.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dev-poligon.victor-komlev.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev-poligon.victor-komlev.ru;
    ssl_certificate /etc/letsencrypt/live/dev-poligon.victor-komlev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-poligon.victor-komlev.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # tsk-614: API уходит в LMS СВОЕГО tier'а, минуя процесс Next.
    # Без этого блока `/api/v1/*` попадает в rewrites из `next.config.ts`, а они
    # заморожены на этапе `pnpm build` (сборка одна на все три tier'а) и вели в
    # БОЕВУЮ LMS `127.0.0.1:8000` — прямое нарушение требования tsk-182
    # «учеников на прод не пускать». Тот же приём, что на проде (`spw.conf`).
    client_max_body_size 10M;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /embed-api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

