# Nginx site config для учебного полигона QA (tsk-182) — 6 доменов, 1 VPS.
# Установить в /etc/nginx/sites-available/poligon.conf, включить симлинком
# в sites-enabled. SSL-блоки добавляет certbot автоматически при первом
# `certbot --nginx -d ...` (см. README.md) — здесь заранее только ACME-challenge
# + HTTP redirect, как в прод nginx-lms.conf/nginx-spw.conf.

# ───────────────────────── LMS API — 3 tier'а ─────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name api-dev-poligon.victor-komlev.ru api-test-poligon.victor-komlev.ru api-stage-poligon.victor-komlev.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-dev-poligon.victor-komlev.ru;

    ssl_certificate     /etc/letsencrypt/live/api-dev-poligon.victor-komlev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev-poligon.victor-komlev.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

