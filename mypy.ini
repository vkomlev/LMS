[mypy]
python_version = 3.10
explicit_package_bases = True
follow_imports = skip
show_error_codes = True
warn_unused_ignores = True

# boto3/botocore поставляются без аннотаций (stubs — отдельным пакетом
# boto3-stubs, ставить его ради двух вызовов put_object/get_object не за что).
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

