[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    no_tx_isolation: тест работает вне откатываемой транзакции (нужны параллельные соединения: гонки, блокировки, видимость между транзакциями). Обязан чистить за собой сам.
    requires_redis: тесту нужен живой Redis по REDIS_URL (localhost:6379 по умолчанию). Без него тест пропускается с причиной, а не падает внутренностями драйвера (tsk-611).
